syntax = "proto3";

package todo.v1;
option go_package = "example.com/devops-lab6/proto;pb";

service Todo {
  rpc Create(CreateRequest) returns (IDRequest);
  rpc GetByID(IDRequest) returns (Task);
  rpc MarkDone(IDRequest) returns (DoneResponse);
}

message CreateRequest {
  string title = 1;
  string description = 2;
  int32 priority = 3;
}

message IDRequest {
  string id = 1;
}

message Task {
  string id = 1;
  string title = 2;
  string description = 3;
  bool done = 4;
  int64 created_on = 5;
  int32 priority = 6;
}

message DoneResponse {
  bool ok = 1;
}
