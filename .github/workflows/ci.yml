name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    name: Build and Test (Go ${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ['1.21.x', '1.22.x']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: false
      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: gomod-${{ runner.os }}-${{ matrix.go }}-${{ hashFiles('go.sum') }}
      - name: Build
        run: go build ./...
      - name: Test
        run: go test -coverprofile=coverage.out ./cmd/todo-service
      - name: Lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.64.8
      - name: Upload coverage
        if: matrix.go == '1.22.x'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out
