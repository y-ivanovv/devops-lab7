name: Docker
on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]
permissions:
  contents: read
concurrency:
  group: docker-main
  cancel-in-progress: true
jobs:
  publish:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Build and smoke test image
        shell: bash
        run: |
          docker build -t todo-service:ci .
          docker run -d --rm --name todo-ci -p 127.0.0.1:8080:8080 todo-service:ci
          trap 'docker stop todo-ci' EXIT
          url=http://127.0.0.1:8080/tasks
          task=$(curl -fsS --retry 6 --retry-connrefused -H 'Content-Type: application/json' -d '{"title":"CI smoke test"}' "$url")
          id=$(jq -er '.id' <<< "$task")
          curl -fsS -X PATCH "$url/$id/done"
          curl -fsS "$url/$id" | jq -e '.done == true'
      - name: Sign in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Push image
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          COMMIT_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          image="${DOCKERHUB_USERNAME}/todo-service"
          short_tag="sha-${COMMIT_SHA:0:7}"
          docker tag todo-service:ci "$image:$short_tag"
          docker tag todo-service:ci "$image:main"
          docker push "$image:$short_tag"
          if [ "$(git ls-remote origin refs/heads/main | cut -f1)" = "$COMMIT_SHA" ]; then
            docker push "$image:main"
          fi
